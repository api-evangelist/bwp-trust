name: BWP Trust

description: BWP Trust ("BWP" or "the Trust") is an Australian real estate investment trust, established and listed on the
  Australian Securities Exchange (ASX) in 1998, that invests in and manages commercial properties throughout Australia. It
  is the largest owner of Bunnings Warehouse sites in Australia, alongside large format retail showroom and industrial properties.
  Its website (bwptrust.com.au) is an investor-relations site; it publishes no developer portal, API documentation or public
  API.

